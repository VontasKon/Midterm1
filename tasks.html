<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Task section is hsre, players can see and add more tasks.">
    <meta name="keywords" content="Tasks, Form, DND">
    <meta name="author" content="vontas">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Tasks">
    <title>Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">  
    <script src="scripts/navbar.js" defer></script>
    <script src="scripts/footer.js" defer></script>
    <script src="scripts/darkmode.js" defer></script>
    <script src="scripts/todaysdate.js" defer></script>
    <script src="scripts/tasks.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
</head>
<body>
    
<div id="navbar" class="sticky-top"></div>

<!-- header kinda -->
<section class="p-3 mb-4 text-white text-center site-hero">
    <div class="container-fluid p-3">
        <h1 class="display-5 fw-bold">
            Task Manager
        </h1>

        <p class="fs-5 mt-3">
            Here you will find the task manager where tasks are shown.
        </p>

        <p>
            Use this to stay up to date with your campaign tasks or upload your own. 
        </p>
    </div>
</section>



<section class="container my-5">
    <h2 class="mb-3">Campaign Tasks</h2>
    <!-- Task counter -->
    <p id="taskCount" class="text-muted"></p>
    <!-- Search tasks -->
    <div class="mb-3">
        <input
            type="search"
            id="taskSearch"
            class="form-control"
            placeholder="Search tasks..."
            aria-label="Search tasks">
    </div>
    <!-- Filter tasks -->
    <div class="mb-3">
        <select id="statusFilter" class="form-select"
                aria-label="Filter tasks by status">

            <option value="All">All statuses</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
        </select>
    </div>
    <!-- Feedback message -->
    <p id="taskMessage" role="status" aria-live="polite"></p>
    <!-- Responsive table -->
    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle task-table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Task Name</th>
                    <th scope="col">Description</th>
                    <th scope="col">Due Date</th>
                    <th scope="col">Priority</th>
                    <th scope="col">Status</th>
                    <th scope="col">Functions</th>
                </tr>
            </thead>
            <!-- this is the place where the script will put th rows -->
            <tbody id="taskTable">
            </tbody>
        </table>
    </div>

</section>



<hr>

<!-- -->



    <!-- TASK SUBMISSION FORM -->
<section class="container my-5">
    <h2>Add a New Task</h2>
    <form id="taskForm">

        <div class="mb-3">
            <label for="taskName" class="form-label">
                Task Name
            </label>
            <input
                type="text"
                id="taskName"
                class="form-control"
                required
                maxlength="150">
        </div>

        <div class="mb-3">
            <label for="taskDescription" class="form-label">
                Description
            </label>
            <textarea
                id="taskDescription"
                class="form-control"
                rows="3"
                required
                maxlength="150"
            ></textarea>
        </div>

        <div class="mb-3">
            <label for="taskDate" class="form-label">
                Due Date
            </label>
            <input
                type="date"
                id="taskDate"
                class="form-control"
                required>
        </div>
       

        <div class="mb-3">
            <label for="taskPriority" class="form-label">
                Priority
            </label>
            <select id="taskPriority" class="form-select">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
            </select>
        </div>
       
       
    
        <div class="mb-3">
            <label for="taskStatus" class="form-label">
                Status
            </label>
            <select id="taskStatus" class="form-select">
                <option value="Pending" selected>Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
        </div>
        <!-- Submit -->
        <button type="submit" id="taskSubmitButton" class="btn text-white btn-brand">
            Add Task
        </button>
        <!-- cancel editing buton -->
        <button type="button" id="cancelEditButton" class="btn btn-secondary" hidden >
            Cancel Edits
        </button>
    </form>
</section>

<div id="footer"></div>

</body>
</html>
