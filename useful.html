<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Some extra useful resources can be found here..">
    <meta name="keywords" content="Downloads, Resources, DND">
    <meta name="author" content="vontas">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Useful Resources">
    <title>Useful Resources</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts/navbar.js" defer></script>
    <script src="scripts/footer.js" defer></script>
    <script src="scripts/darkmode.js" defer></script>
    <script src="scripts/dice.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
</head>
<body>
    
<div id="navbar" class="sticky-top"></div>

<section class="p-3 mb-4 text-white text-center site-hero">
    <div class="container-fluid p-3">
        <h1 class="display-5 fw-bold">
            Useful Resources
        </h1>

        <p class="fs-5 mt-3">
            A collection of useful websites and resources related to D&D.
        </p>
    </div>
</section>

<h3 class="text-center mt-4"> Fillable D&D Character Sheet</h3>

<div class="text-center my-4">
  <a href="useful/character_sheet.pdf" 
     class="btn text-light btn-brand" 
     download="Dnd_Character_Sheet.pdf">
     Download Character Sheet
  </a>
</div>

<hr>

<section class="container my-1">
    <div class="card bg-body-tertiary shadow rounded-3 p-4 text-center">
        <h2 class="fw-bold mb-3">D&D Dice Roller</h2>
        <p>Click a die to roll it!</p>
        <div class="d-flex justify-content-center flex-wrap gap-2 mb-4">

            <button id="rollD4" class="btn text-white btn-brand">D4</button>
            <button id="rollD6" class="btn text-white btn-brand">D6</button>
            <button id="rollD8" class="btn text-white btn-brand">D8</button>
            <button id="rollD10" class="btn text-white btn-brand">D10</button>
            <button id="rollD12" class="btn text-white btn-brand">D12</button>
            <button id="rollD20" class="btn text-white btn-brand">D20</button>
            <button id="rollD100" class="btn text-white btn-brand">%100</button>

        </div>

        <h1 id="diceResult" class="display-1 fw-bold my-3">?</h1>

        <p id="diceMessage">Your result will appear here.</p>
    </div>
</section>

<h3 class="text-center mt-4">A very useful video on getting started.</h3>


<div class="ratio ratio-16x9 w-75 mx-auto">
  <iframe src="https://www.youtube.com/embed/1D5Mpd4lMS4" title="YouTube video" allowfullscreen></iframe>
</div>

<hr>

<div id="footer"></div>

</body>
</html>
