<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="scripts/contact.js" defer></script>
    <script src="scripts/navbar.js" defer></script>
    <script src="scripts/footer.js" defer></script>
</head>
<body>
    
<div id="navbar"></div>



<!--ICONSs -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">




<!-- header kinda -->
<section class="p-3 mb-4 text-white text-center" style="background: linear-gradient(135deg, #E53935 0%, #ee3d07 50%, #E53935 100%)">
    <div class="container-fluid p-3">
        <h1 class="display-5 fw-bold">
            Contact Us
        </h1>

        <p class="fs-5 mt-3">
            For any questions, fill out the form below.
        </p>

        <p>
            You can also join the Discord or follow us on Instagram. 
        </p>
    </div>
</section>

<div class="container py-5">

    <div class="row g-4">

        <!-- Contact Form Section -->
        <div class="col-md-6">
            <h3>Sent us a message for any questions, or if you want to play with us!</h3>

            <!-- FILL FORM-->
            <form id="contactForm">

                <!-- FULLLNAME -->
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" name="name" class="form-control shadow-lg" required maxlength="150">
                </div>

                <!-- Email field (required) -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email" class="form-control shadow-lg" required maxlength="250">
                </div>

                <!-- Title -->
                <div class="mb-3">
                    <label for="subject" class="form-label">Subject</label>
                    <input type="text" id="subject" name="subject" class="form-control shadow-lg" required maxlength="150">
                </div>

                <!-- your message here-->
                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" name="message" class="form-control shadow-lg" rows="5" required maxlength="2000"></textarea>
                </div>

                <!-- submisison buton -->
                <button type="submit" class="btn p-2 shadow text-white"  style="background-color: #E53935; border-color: #E53935;">Send Message</button>
            </form>
        </div>

        <!-- googlem,aps -->
        <div class="col-md-6">
            <h3>We play in Athens, Vironas</h3>

            <!-- DA MAP!!!!! -->

            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d23136.221697304667!2d23.749703088067392!3d37.953743551051836!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14a1bd7d18ceb21f%3A0x654cbeb4e950055a!2zzpLPjc-Bz4nOvc6xz4I!5e1!3m2!1sel!2sgr!4v1792849345369!5m2!1sel!2sgr" 
                 width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" title="D&D location map">
            </iframe>

        </div>

    </div>

    <!-- Social Media Links Section -->
    <div class="text-center mt-5">
        <h3>Scocial edia</h3>

        <!-- Discord link and icon -->
        <a href="https://discord.com/" class="fs-2 mx-3 text-danger shadow-lg" aria-label="Discord">
            <i class="bi bi-discord"></i>
        </a>

        <!-- Instagram link and icon -->
        <a href="https://instagram.com/" class="fs-2 mx-3 text-danger shadow-lg" aria-label="Instagram">
            <i class="bi bi-instagram"></i>
        </a>
    </div>
</div>

<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
